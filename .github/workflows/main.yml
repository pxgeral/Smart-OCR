name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'tool/ambil_model.sh'
      - '.github/workflows/main.yml'

permissions:
  contents: write  # untuk menerbitkan APK di halaman Releases

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: ${{ hashFiles('pubspec.lock') }}

      - name: Cache model terjemahan offline
        uses: actions/cache@v4
        with:
          path: assets/models
          key: model-opus-mt-${{ hashFiles('tool/ambil_model.sh') }}

      - name: Unduh model terjemahan offline (ikut terkemas di APK)
        run: bash tool/ambil_model.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart sources
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        run: |
          flutter build apk --release
          ls -la build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: smart-ocr-converter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VER=${VER%%+*}
          TAG="v${VER}-build${{ github.run_number }}"
          APK="Smart-OCR-${VER}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          gh release create "$TAG" "$APK" \
            --title "Smart OCR ${VER} (build ${{ github.run_number }})" \
            --notes "APK otomatis dari commit ${GITHUB_SHA::7}. Unduh lalu pasang di HP Android." \
            --latest
