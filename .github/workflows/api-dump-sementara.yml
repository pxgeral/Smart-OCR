name: API Dump Sementara
on:
  push:
    branches: [terjemahan-offline]
    paths: ['.github/workflows/api-dump-sementara.yml']
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Ambil paket onnxruntime
        run: |
          flutter --version | head -2
          mkdir -p /tmp/probe && cd /tmp/probe
          flutter create --project-name probe . >/dev/null 2>&1
          flutter pub add onnxruntime >/dev/null 2>&1
          flutter pub get >/dev/null 2>&1
          D=$(find ~/.pub-cache/hosted -maxdepth 2 -type d -name 'onnxruntime-*' | head -1)
          echo "DIR=$D"
          ls "$D" "$D/lib/src" "$D/android" "$D/linux" 2>&1 | head -60
          echo "=== ort_value 200-520"
          sed -n 200,520p "$D/lib/src/ort_value.dart"
          echo "=== ort_session run 140-235"
          sed -n 140,235p "$D/lib/src/ort_session.dart"
          echo "=== android build.gradle"
          cat "$D/android/build.gradle"
          echo "=== android native libs"
          find "$D/android" "$D/linux" -name '*.so*' -o -name '*.aar' -o -name '*.jar' | head
          grep -n "ONNX\|onnxruntime\|aar\|jniLibs\|abiFilters" "$D/android/build.gradle" "$D/android/settings.gradle" | head -20
          echo "=== pubspec"
          cat "$D/pubspec.yaml"
          echo "=== dart sdk constraint"
          dart --version
