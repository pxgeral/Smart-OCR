name: Cek Pull Request

# Hanya memeriksa (analisis, tes, build debug). Tidak menerbitkan APK ke Releases.
on:
  pull_request:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'tool/ambil_model.sh'
      - '.github/workflows/cek-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cek-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: ${{ hashFiles('pubspec.lock') }}

      - name: Cache model terjemahan offline
        uses: actions/cache@v4
        with:
          path: assets/models
          key: model-opus-mt-${{ hashFiles('tool/ambil_model.sh') }}

      - name: Unduh model terjemahan offline
        run: bash tool/ambil_model.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart sources
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build debug APK (cek kompilasi + model terkemas)
        run: |
          flutter build apk --debug
          APK=build/app/outputs/flutter-apk/app-debug.apk
          ls -la "$APK"
          echo "Model di dalam APK:"; unzip -l "$APK" | grep -E 'assets/models/.*(onnx|vocab|spm)' || { echo "MODEL TIDAK TERKEMAS"; exit 1; }
