name: smart_ocr_converter
description: Foto & PDF ke Word/Excel dengan OCR.
publish_to: none
version: 1.1.0+4

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  # scanner
  google_mlkit_document_scanner: ^0.6.1
  image_picker: ^1.1.2
  file_picker: ^13.3.2
  pdfx: ^2.11.0
  # ocr
  google_mlkit_text_recognition: ^0.17.1
  image: ^4.12.0
  # export (DOCX & XLSX dibuat sendiri: ZIP + XML)
  pdf: ^3.11.0
  share_plus: ^13.3.1
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
