name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan proyek Android (jika belum ada)
        run: |
          [ -d android ] || flutter create --platforms=android --org com.geral --project-name smart_ocr_converter .
          # Android 8+ (API 26)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/' android/app/build.gradle*
          sed -i 's/android:label="[^"]*"/android:label="Smart OCR Converter"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      # --no-shrink: hindari error R8 "missing classes" dari ML Kit (skrip non-Latin).
      - run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: smart-ocr-converter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
